<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>АБ Движение · прототип</title>
<style>
:root{color-scheme:light;
 --ink:#1a1a1a;--paper:#fff;--bg:#f8f8f6;--line:#e8e6e1;--line2:#d4d0c8;
 --mut:#6b6b6b;--mut2:#9c968c;--acc:#a0522d;--soft:#f5ede6;--soft2:#ebdccf;
 --dark:#161412;--don:#f5f2ee;--dmut:#8f867d;--dline:#332e29;
 --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
 --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,"Helvetica Neue",Arial,sans-serif;
 --pad:clamp(20px,5vw,64px)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 var(--sans);
 -webkit-font-smoothing:antialiased;letter-spacing:-.005em}
.hide{display:none!important}
::selection{background:var(--ink);color:#fff}

/* панель прототипа */
.tools{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;
 background:var(--dark);color:var(--don);padding:9px clamp(16px,4vw,28px);flex-wrap:wrap}
.tools .br{font:10px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--dmut)}
.tools .addr{flex:1;min-width:160px;font:11px/1 var(--mono);color:var(--dmut);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tools button{font:10px/1 var(--mono);text-transform:uppercase;letter-spacing:.1em;
 border:1px solid var(--dline);background:transparent;color:var(--don);padding:8px 13px;cursor:pointer}
.tools button:hover{border-color:var(--acc);color:#fff}
.tools button[aria-pressed="true"]{background:var(--don);color:var(--dark);border-color:var(--don)}

/* пояснение */
.exp{background:#201c19;color:var(--don);padding:16px clamp(20px,5vw,64px);display:flex;gap:20px;flex-wrap:wrap;align-items:baseline}
.exp code{font:11px/1.3 var(--mono);color:var(--soft2);background:var(--dline);padding:4px 9px;flex:0 0 auto}
.exp p{margin:0;font-size:13px;line-height:1.6;flex:1;min-width:260px}

/* шапка сайта */
header.site{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--line)}
.hin{display:flex;align-items:center;gap:clamp(16px,3vw,40px);padding:0 var(--pad);height:66px}
.logo{font:700 17px/1 var(--sans);letter-spacing:-.03em;white-space:nowrap;cursor:pointer}
.logo i{font-style:normal;color:var(--acc)}
nav.main{display:flex;gap:clamp(10px,2vw,24px);flex:1;overflow-x:auto;scrollbar-width:none}
nav.main::-webkit-scrollbar{display:none}
nav.main a{font:11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);
 text-decoration:none;cursor:pointer;padding:6px 0;border-bottom:1px solid transparent;white-space:nowrap}
nav.main a:hover{color:var(--ink)}
nav.main a.on{color:var(--ink);border-bottom-color:var(--acc)}
.tel{font:12px/1 var(--mono);color:var(--ink);white-space:nowrap}
@media(max-width:860px){.tel{display:none}}

main{background:var(--paper)}
.wrap{padding-left:var(--pad);padding-right:var(--pad)}
.mx{max-width:1320px;margin:0 auto}

/* герой */
.hero{background:var(--soft);color:var(--ink);position:relative;overflow:hidden}
.hero .guides{position:absolute;inset:0;max-width:1320px;margin:0 auto;
 padding-left:var(--pad);padding-right:var(--pad);display:grid;grid-template-columns:repeat(12,1fr);gap:0;pointer-events:none;opacity:.16}
@media(max-width:700px){.hero .guides i{border-left:0}.hero .guides i:first-child,.hero .guides i:last-child{border-left:1px solid var(--acc)}}
.hero .guides i{border-left:1px solid var(--acc)}
.hero .guides i:last-child{border-right:1px solid var(--acc)}
.hin2{position:relative;display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(24px,5vw,64px);
 align-items:end;padding-top:clamp(56px,9vw,112px);padding-bottom:clamp(40px,6vw,72px)}
.eyebrow{font:10px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--acc);
 display:flex;align-items:center;gap:12px;margin-bottom:clamp(20px,3vw,34px)}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--soft2)}
h1{font-size:clamp(38px,6.6vw,86px);line-height:.97;letter-spacing:-.04em;font-weight:700;margin:0}
h1 em{font-style:normal;color:var(--acc)}
.hero p.sub{color:var(--mut);font-size:clamp(15px,1.5vw,18px);max-width:44ch;margin:clamp(20px,3vw,30px) 0 0;line-height:1.6}
.hero .art{color:var(--acc);opacity:.55;align-self:center}
.hero .art svg{width:100%;height:auto;display:block}
@media(max-width:900px){.hin2{grid-template-columns:1fr}.hero .art{display:none}}

/* лента цифр */
.band{background:var(--dark);color:var(--don);border-top:1px solid var(--dline)}
.band .g{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--dline)}
.band .c{background:var(--dark);padding:clamp(22px,3.4vw,40px) clamp(14px,2vw,28px)}
.band b{display:block;font-size:clamp(28px,4.4vw,56px);line-height:1;letter-spacing:-.045em;font-weight:700}
.band span{display:block;font:10px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dmut);margin-top:12px}
@media(max-width:720px){.band .g{grid-template-columns:repeat(2,1fr)}}

/* плашка во всю ширину: разрывает белую простыню, ритм из дизайн-направления */
.s.tint{box-shadow:0 0 0 100vmax var(--soft);clip-path:inset(0 -100vmax);border-top-color:transparent}
.s.tint+.s{border-top-color:transparent}
.s.gray{box-shadow:0 0 0 100vmax var(--bg);clip-path:inset(0 -100vmax);border-top-color:transparent}
.s.gray+.s{border-top-color:transparent}

/* секции */
section.s{padding-top:clamp(56px,8vw,104px);padding-bottom:clamp(56px,8vw,104px);border-top:1px solid var(--line)}
section.s:first-of-type{border-top:0}
.slab{display:flex;align-items:baseline;gap:16px;margin-bottom:clamp(22px,3vw,36px)}
.slab i{font:10px/1 var(--mono);letter-spacing:.16em;color:var(--acc);font-style:normal}
.slab h2{font-size:clamp(24px,3.2vw,40px);letter-spacing:-.032em;line-height:1.08;margin:0;font-weight:700;flex:1}
.slab .more{font:10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);
 border:0;background:0;cursor:pointer;padding:0;white-space:nowrap;border-bottom:1px solid var(--line2)}
.slab .more:hover{color:var(--ink);border-color:var(--ink)}
.lede{font-size:clamp(16px,1.7vw,20px);line-height:1.55;color:var(--mut);max-width:56ch;margin:0 0 clamp(24px,3vw,36px)}
.crumb{font:10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mut2);
 padding-top:clamp(22px,3vw,34px)}
.crumb b{color:var(--ink);font-weight:400}

.qlab2{font:10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.scen .sg{display:block;font-style:normal;font:10px/1.5 var(--mono);letter-spacing:.08em;text-transform:uppercase;
 color:var(--acc);border-top:1px solid var(--line);padding-top:12px;margin-top:12px}

/* сценарии и дорожная карта */
.scen{border:1px solid var(--line);background:var(--paper);padding:clamp(18px,2.2vw,26px);cursor:pointer;
 text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column;gap:9px;min-height:150px;
 transition:border-color .15s,background .15s}
.scen:hover{border-color:var(--acc);background:var(--soft)}
.scen .n{font:10px/1 var(--mono);letter-spacing:.14em;color:var(--acc)}
.scen b{font-size:clamp(16px,1.9vw,20px);letter-spacing:-.022em;font-weight:600;line-height:1.25}
.scen small{color:var(--mut);font-size:13.5px;line-height:1.55;margin-top:auto}
.road{border-top:1px solid var(--ink)}
.rd{display:grid;grid-template-columns:76px 1fr;gap:clamp(14px,2.4vw,32px);
 padding:clamp(20px,2.6vw,32px) 0;border-bottom:1px solid var(--line)}
.rn{font:10px/1 var(--mono);letter-spacing:.16em;color:var(--acc);padding-top:6px}
.rc b{display:block;font-size:clamp(17px,2.1vw,24px);letter-spacing:-.026em;font-weight:600;line-height:1.2}
.rc p{margin:9px 0 0;color:var(--mut);font-size:15px;line-height:1.6;max-width:56ch}
.rt{display:flex;gap:18px;flex-wrap:wrap;margin-top:16px;align-items:baseline}
.rt span{font:10px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);
 border:1px solid var(--line2);padding:7px 11px}
.rt em{font-style:normal;font:10px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mut2)}
@media(max-width:640px){.rd{grid-template-columns:1fr;gap:8px}}
.way{border:1px solid var(--line);background:var(--paper);padding:clamp(18px,2.2vw,26px);display:flex;flex-direction:column;gap:10px}
.way.hot{border-color:var(--ink);border-width:2px;background:var(--paper)}
.way .n{font:10px/1 var(--mono);letter-spacing:.14em;color:var(--acc)}
.way b{font-size:clamp(16px,1.9vw,20px);letter-spacing:-.022em;font-weight:600}
.way p{margin:0;color:var(--mut);font-size:14.5px;line-height:1.6}
.way small{margin-top:auto;padding-top:12px;font:10px/1.5 var(--mono);letter-spacing:.08em;
 text-transform:uppercase;color:var(--mut2);border-top:1px solid var(--line)}
.way.hot small{color:var(--acc)}

/* страница услуги */
.shero{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(22px,4vw,56px);align-items:center}
@media(max-width:860px){.shero{grid-template-columns:1fr}.shero .ph{display:none}}
h1.h1s{font-size:clamp(30px,4.6vw,58px);line-height:1.02;letter-spacing:-.035em;font-weight:700;margin:0 0 18px}
.pbox{border:1px solid var(--ink);padding:clamp(22px,3.2vw,40px);background:var(--paper)}
.pbox.mq{background:var(--paper);border-color:var(--line2);border-left:3px solid var(--acc)}
.pbox .pk{font:10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--acc);margin-bottom:18px}
.pbox .figure span{font-size:.36em;letter-spacing:-.01em;color:var(--mut);font-weight:600}
.pbox .pn{color:var(--mut);font-size:15px;line-height:1.65;max-width:60ch;margin:18px 0 0}
.pbox .pn b{color:var(--ink)}
.pbox .rows{margin-bottom:0}
.fin{border:1px solid var(--ink);background:var(--paper);padding:clamp(24px,3.4vw,44px);
 display:grid;grid-template-columns:1.3fr auto;gap:clamp(20px,3vw,40px);align-items:center}
.fin b{display:block;font-size:clamp(20px,2.6vw,30px);letter-spacing:-.03em;line-height:1.12;font-weight:700}
.fin p{margin:12px 0 0;color:var(--mut);font-size:15px;line-height:1.6;max-width:52ch}
@media(max-width:760px){.fin{grid-template-columns:1fr}}

/* этапы услуг */
.stage{margin-bottom:clamp(26px,3.4vw,44px)}
.stage:last-child{margin-bottom:0}
.sh{display:flex;align-items:baseline;gap:14px;padding-bottom:14px;margin-bottom:clamp(12px,1.6vw,18px);border-bottom:1px solid var(--ink)}
.sh i{font:10px/1 var(--mono);letter-spacing:.16em;color:var(--acc);font-style:normal}
.sh b{font-size:clamp(15px,1.8vw,19px);letter-spacing:-.02em;font-weight:600;flex:1}
.sh em{font:10px/1 var(--mono);letter-spacing:.12em;color:var(--mut2);font-style:normal}

/* сетки и карточки */
.g{display:grid;gap:clamp(12px,1.6vw,22px)}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}.g6{grid-template-columns:repeat(6,1fr)}
@media(max-width:980px){.g3,.g4,.g6{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.g2,.g3,.g4,.g6{grid-template-columns:1fr}}
.card{border:1px solid var(--line);background:var(--paper);text-align:left;font:inherit;color:inherit;
 cursor:pointer;display:flex;flex-direction:column;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--ink);transform:translateY(-2px)}
.card .th{border-bottom:1px solid var(--line);background:var(--bg);color:var(--acc);padding:14px}
.card .th svg{width:100%;height:auto;display:block}
.card .bd{padding:clamp(14px,1.6vw,20px);display:flex;flex-direction:column;gap:5px;flex:1}
.card b{font-size:15px;letter-spacing:-.015em;font-weight:600;line-height:1.35}
.card small{font:10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mut2)}
.card .pr{margin-top:auto;padding-top:12px;font-size:17px;font-weight:700;letter-spacing:-.02em}
.tile{border:1px solid var(--line);padding:clamp(16px,2vw,24px);cursor:pointer;background:var(--paper);
 text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column;gap:8px;min-height:112px;transition:border-color .15s}
.tile:hover{border-color:var(--ink)}
.tile .n{font:10px/1 var(--mono);letter-spacing:.14em;color:var(--mut2)}
.tile b{font-size:15px;font-weight:600;letter-spacing:-.015em;line-height:1.35}
.tile .dd{font-style:normal;color:var(--mut);font-size:13.5px;line-height:1.5}
.tile small{margin-top:auto;font:10px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--mut2)}
.tile.hot{border-color:var(--ink);border-width:2px}
.tile.hot small{color:var(--acc)}
.feat{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(20px,4vw,56px);align-items:center;
 border:1px solid var(--ink);background:var(--paper);padding:clamp(22px,3.4vw,44px);cursor:pointer;
 text-align:left;font:inherit;color:inherit;transition:background .16s;margin-bottom:clamp(12px,1.6vw,22px)}
.feat:hover{background:var(--soft)}
.feat .n{font:10px/1 var(--mono);letter-spacing:.16em;color:var(--acc);display:block;margin-bottom:16px}
.feat b{display:block;font-size:clamp(22px,3vw,36px);letter-spacing:-.035em;line-height:1.08;font-weight:700}
.feat p{margin:14px 0 0;color:var(--mut);font-size:15px;line-height:1.6;max-width:46ch}
.feat small{display:inline-block;margin-top:22px;font:10px/1 var(--mono);letter-spacing:.12em;
 text-transform:uppercase;color:var(--ink);border-bottom:1px solid var(--acc);padding-bottom:5px}
.feat .fa{color:var(--line2)}
.feat .fa svg{width:100%;height:auto;display:block}
@media(max-width:820px){.feat{grid-template-columns:1fr}.feat .fa{display:none}}

.steps{border-top:1px solid var(--line)}
.steps .r{display:grid;grid-template-columns:64px 1fr 1.3fr;gap:clamp(14px,3vw,40px);
 padding:clamp(18px,2.4vw,30px) 0;border-bottom:1px solid var(--line);align-items:baseline}
.steps .r i{font:10px/1 var(--mono);letter-spacing:.14em;color:var(--acc);font-style:normal}
.steps .r b{font-size:clamp(16px,1.9vw,22px);letter-spacing:-.025em;font-weight:600}
.steps .r p{margin:0;color:var(--mut);font-size:14px;line-height:1.6}
@media(max-width:700px){.steps .r{grid-template-columns:44px 1fr}.steps .r p{grid-column:2}}

.ph{border:1px solid var(--line);background:var(--bg);color:var(--acc);padding:clamp(16px,2.2vw,28px);
 display:flex;align-items:center;justify-content:center}
.ph svg{width:100%;height:auto;max-height:var(--mh,260px);display:block}
.txtph{border-left:2px solid var(--line);padding-left:18px;display:flex;flex-direction:column;gap:9px}
.txtph i{display:block;height:9px;background:var(--line);border-radius:1px}
.txtph i:nth-child(3n){width:72%}.txtph i:nth-child(4n){width:88%}

/* блок расчёта */
.calc{background:var(--dark);color:var(--don);padding:clamp(26px,4vw,52px);position:relative;overflow:hidden}
.calc .lab{font:10px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--soft2);margin-bottom:16px}
.calc h3{font-size:clamp(24px,3.4vw,42px);letter-spacing:-.035em;line-height:1.05;margin:0 0 12px;font-weight:700;max-width:20ch}
.calc p.c{color:var(--dmut);margin:0 0 clamp(22px,3vw,32px);max-width:52ch;font-size:15px}
.calc .qlab{font:10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--soft2);margin-bottom:12px}
.opt{border:1px solid var(--dline);background:transparent;color:var(--don);padding:16px 18px;cursor:pointer;
 text-align:left;font:15px/1.4 var(--sans);letter-spacing:-.01em;transition:background .14s,border-color .14s}
.opt:hover{background:#201c19;border-color:var(--acc)}
.opt small{display:block;color:var(--dmut);font-size:12px;margin-top:4px;line-height:1.45}
.calc.manual{background:var(--paper);color:var(--ink);border:1px solid var(--line2);border-left:3px solid var(--acc)}
.calc.manual .lab,.calc.manual .qlab{color:var(--acc)}
.calc.manual p.c{color:var(--mut)}
.calc.manual .opt{border-color:var(--line2);color:var(--ink)}
.calc.manual .opt:hover{background:var(--bg)}

/* кнопки, поля */
.btn{border:1px solid var(--ink);background:transparent;color:var(--ink);padding:14px 24px;cursor:pointer;
 font:11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;transition:background .14s,color .14s}
.btn:hover{background:var(--ink);color:#fff}
.btn.p{background:var(--ink);color:#fff}
.btn.p:hover{background:var(--acc);border-color:var(--acc)}
.btn.gh{border-color:var(--line2);color:var(--mut)}
.btn.gh:hover{border-color:var(--ink);background:transparent;color:var(--ink)}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn:disabled:hover{background:transparent;color:var(--ink)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
input[type=text],input[type=number]{border:0;border-bottom:1px solid var(--line2);background:transparent;
 padding:12px 0;font:17px var(--sans);width:100%;color:var(--ink);letter-spacing:-.015em}
input:focus{outline:0;border-bottom-color:var(--acc)}
input::placeholder{color:var(--mut2)}
input[type=range]{width:100%;accent-color:var(--acc);border:0}

.note{font:10px/1.55 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--mut2);margin:14px 0 0}
.note.b::before{content:"— ";color:var(--acc)}
.pull{border-left:2px solid var(--acc);padding:4px 0 4px 20px;font-size:15px;line-height:1.6;color:var(--mut);margin:20px 0}
.pull b{color:var(--ink);font-weight:600}

/* квиз */
.ov{position:fixed;inset:0;z-index:60;background:var(--paper);display:flex;flex-direction:column;overflow:auto}
.ovin{max-width:1040px;width:100%;margin:0 auto;padding:clamp(20px,4vw,48px) var(--pad) clamp(40px,6vw,72px);
 flex:1;display:flex;flex-direction:column}
.ovtop{display:flex;align-items:center;gap:20px;margin-bottom:clamp(36px,7vw,76px)}
.pbar{flex:1;height:1px;background:var(--line2);max-width:420px;position:relative}
.pbar i{position:absolute;inset:0 auto 0 0;height:1px;background:var(--acc);transition:width .25s}
.stp{font:10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mut2)}
.xb{margin-left:auto;width:38px;height:38px;border:1px solid var(--line2);background:transparent;cursor:pointer;
 font:16px/1 var(--sans);color:var(--mut)}
.xb:hover{border-color:var(--ink);color:var(--ink)}
.ov h3{font-size:clamp(28px,4.6vw,52px);letter-spacing:-.038em;line-height:1.05;margin:0 0 14px;font-weight:700;max-width:18ch}
.ov .hint{font-size:15px;color:var(--mut);margin:0 0 clamp(26px,4vw,40px);max-width:56ch;line-height:1.6}
.stack{display:flex;flex-direction:column;gap:10px;max-width:660px}
.oc{border:1px solid var(--line2);background:transparent;color:var(--ink);padding:18px 20px;cursor:pointer;
 text-align:left;font:16px/1.4 var(--sans);letter-spacing:-.015em;display:flex;align-items:baseline;gap:14px;transition:border-color .14s,background .14s}
.oc:hover{border-color:var(--acc);background:var(--soft)}
.oc[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.oc[aria-pressed="true"] small{color:var(--dmut)}
.oc[aria-pressed="true"] .mk{background:#fff;border-color:#fff}
.oc .mk{flex:0 0 auto;width:9px;height:9px;border:1px solid var(--line2);border-radius:50%;transform:translateY(4px)}
.oc small{display:block;color:var(--mut);font-size:12.5px;margin-top:4px;line-height:1.5}
